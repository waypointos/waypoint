name: ci
on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: '**/go.sum'
      # agent/web and proxy/web go:embed the dashboard build, which is not
      # checked in; stub it so the packages compile without a pnpm build.
      - run: make web-stub
      - run: cd agent && go test ./...
      - run: cd sim && go test ./...
      - run: cd sdk && go test ./...
      - run: cd protocol/platform && go test ./...
      - run: cd proxy && go test ./...

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: cd dashboard && pnpm install --frozen-lockfile
      - run: cd dashboard && pnpm test
      - run: cd dashboard && pnpm build

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev libgtest-dev
      - run: cmake -S core -B core/build -DWP_CORE_BUILD_TESTS=ON
      - run: cmake --build core/build -j"$(nproc)"
      - run: ctest --test-dir core/build --output-on-failure

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make -C firmware/servo-relay/test check
