name: image-build
on:
  push:
    tags: ["image-v*"]

# OIDC: cosign sign-blob uses the workflow's GitHub-issued OIDC token to
# obtain a short-lived Fulcio certificate. No long-lived signing key
# anywhere — the cert's identity claim binds the signature to this
# repo + workflow + tag ref, and Rekor records an inclusion proof.
#
# Caching strategy (supply-chain hardened): the only Buildroot state cached
# is the download dir (image/dl). Buildroot hash-verifies every downloaded
# tarball against its .hash file, so a tampered cache entry is rejected
# rather than built. Compiled artifacts (build/host/staging/target/
# per-package) and ccache are deliberately NOT cached: they would be
# restored into the signed image with no integrity check, which is a
# cache-poisoning path into a release. Every release therefore does a clean
# Buildroot build. docker/build-push-action still caches the buildroot
# build-environment image layers (content-addressed, release-scoped).
#
# Expected timing (ubuntu-latest, 4 vCPU): image-v0.1.0 took 2h10m of clean
# Buildroot build. BR2_PER_PACKAGE_DIRECTORIES in waypoint_prod_defconfig
# lets Buildroot build packages concurrently, which is what makes -j on this
# runner worth anything. Larger runners need a paid plan; measure before
# buying one.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # upload to GitHub Release
      id-token: write    # mint the OIDC token for Fulcio
    env:
      REF_NAME: ${{ github.ref_name }}
      BUILDROOT_VERSION: "2026.02"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # image-prod's vendor-agent and embed-dashboard prerequisites run on
      # the runner (not in the Buildroot container), so they need the Go
      # and pnpm toolchains here.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod

      # pnpm version comes from packageManager in package.json.
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Bake the buildroot Docker image once via buildx, cached on the
      # gha backend. `load: true` makes the image available to the local
      # daemon so `make image-prod` finds `waypoint-buildroot:2026.02`.
      - name: Build buildroot Docker image (cached)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: image
          file: image/Dockerfile.buildroot
          tags: waypoint-buildroot:${{ env.BUILDROOT_VERSION }}
          load: true
          cache-from: type=gha,scope=buildroot-image-release
          cache-to: type=gha,mode=max,scope=buildroot-image-release

      # Buildroot's slow stuff (toolchain, kernel, system libs, ccache,
      # downloaded source tarballs). Keyed on inputs that affect those
      # outputs only — application source changes do NOT bust this cache.
      # Only the download dir is cached, and it is keyed + restore-scoped to
      # the `dl-release` namespace so it cannot collide with any future CI
      # cache. Buildroot re-verifies every tarball against its .hash, and
      # all compiled output is rebuilt clean each run (nothing compiled is
      # restored). Keep image-build tag-triggered, never PR or branch.
      - name: Restore Buildroot download cache (hash-verified sources only)
        id: br-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image/dl
          key: ${{ runner.os }}-buildroot-dl-release-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('image/Dockerfile.buildroot', 'image/external/configs/**', 'image/external/board/**', 'image/external/swupdate/sw-description.in') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-buildroot-dl-release-${{ env.BUILDROOT_VERSION }}-${{ hashFiles('image/Dockerfile.buildroot', 'image/external/configs/**', 'image/external/board/**', 'image/external/swupdate/sw-description.in') }}-

      # Per-package directories trade disk for parallelism: every package
      # gets its own rsynced host/ and target/ tree. The runner's default
      # ~25 GB of free space is tight for that, and an ENOSPC here costs a
      # full rebuild, so drop preinstalled toolchains this build never uses.
      # /opt/hostedtoolcache is left alone — setup-go and setup-node put the
      # Go and pnpm toolchains there.
      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/local/.ghcup
          df -h /

      - name: Build prod image
        run: |
          set -euo pipefail
          version="${REF_NAME#image-v}"
          export WAYPOINT_VERSION="$version"
          make -C image image-prod

      # The raw card image exceeds GitHub's 2 GiB release-asset limit; ship
      # it xz-compressed (Raspberry Pi Imager and Etcher flash .img.xz
      # directly). The .swu stays uncompressed: swupdate consumes it as-is.
      - name: Compress card image
        working-directory: image/output/prod/images
        run: xz -T0 -f waypoint.img

      - name: Sign artifacts (cosign keyless)
        working-directory: image/output/prod/images
        run: |
          set -euo pipefail
          version="${REF_NAME#image-v}"
          for f in waypoint-prod-"$version".swu waypoint.img.xz; do
            cosign sign-blob \
              --yes \
              --bundle "$f.cosign" \
              "$f"
          done

      - name: Compute checksums
        working-directory: image/output/prod/images
        run: |
          set -euo pipefail
          sha256sum waypoint.img.xz waypoint-prod-*.swu > SHA256SUMS

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            image/output/prod/images/waypoint.img.xz
            image/output/prod/images/waypoint.img.xz.cosign
            image/output/prod/images/waypoint-prod-*.swu
            image/output/prod/images/waypoint-prod-*.swu.cosign
            image/output/prod/images/SHA256SUMS
