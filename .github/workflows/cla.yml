name: CLA Assistant

# No repo settings or tokens needed: the permissions block below grants
# the built-in GITHUB_TOKEN the write scopes this job uses, overriding the
# repository's read-only default. Signatures are stored in this same repo
# (signatures/cla.json on the cla-signatures branch).

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # Skip bots (Dependabot, etc.): GitHub gives bot-triggered runs a
    # read-only token so the action can't write the signatures branch or a
    # status, and bot PRs don't need a human CLA anyway.
    if: ${{ !endsWith(github.actor, '[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          path-to-document: 'https://github.com/waypointos/waypoint/blob/main/CLA.md'
          branch: 'cla-signatures'
          allowlist: batuergun,dependabot[bot],*[bot]
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA.'
