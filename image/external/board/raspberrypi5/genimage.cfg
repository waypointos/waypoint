image boot.vfat {
    vfat {
        # Pi 5 boot files: kernel + DTB at BINARIES_DIR root (installed
        # by the kernel package); config.txt + cmdline.txt at
        # BINARIES_DIR/rpi-firmware/ (installed by rpi-firmware package
        # via BR2_PACKAGE_RPI_FIRMWARE_{CONFIG,CMDLINE}_FILE). genimage
        # flattens the path components, so all four files land at the
        # vfat root. Pi 5's SPI EEPROM bootloader handles the
        # bootcode.bin/start.elf/fixup.dat stages, so those are absent.
        files = {
            "Image",
            "bcm2712-rpi-5-b.dtb",
            "rpi-firmware/config.txt",
            "rpi-firmware/cmdline.txt"
        }
    }
    size = 256M
}

# Boot-critical config/state only: identity.toml (~1 KB), the cosign
# verifier cache (~10 MB), bootcount, modules.toml, core.env/agent.env,
# and the store-resize sentinel. Kept small and fixed on purpose so it
# stays robust and predictable; bulk data (module images, recordings)
# lives on the separate, grow-to-fill "store" partition below. Sized 256M
# (up from the original 100M): the contents are tiny, but the headroom is
# free relative to the multi-GB cards we target and absorbs cosign-cache
# growth across many OTA cycles without ever needing to resize /data.
image data.ext4 {
    ext4 {
        label = "waypoint-data"
    }
    size = 256M
}

# Bulk store: module .raw payloads, episode (MCAP) recordings, and
# module-private state. Mounted at /data/waypoint/store. Seeded small so
# the flashed .img stays compact; waypoint-resize grows the on-card
# filesystem to fill the whole card on first boot (it is the LAST
# partition on the GPT, which is what makes grow-to-fill work).
image store.ext4 {
    ext4 {
        label = "waypoint-store"
    }
    size = 64M
}

# The final SD-card image. Buildroot already produced rootfs.squashfs
# (we don't re-generate it here). Both A and B partitions get the same
# rootfs at initial flash time — the first OTA apply writes a new
# version into whichever partition is inactive.
image waypoint.img {
    hdimage {
        partition-table-type = "gpt"
    }

    partition boot {
        partition-uuid = "CCCCCCCC-CCCC-CCCC-CCCC-CCCCCCCCCCCC"
        partition-type-uuid = "F"
        bootable = "true"
        image = "boot.vfat"
    }
    partition rootfs-a {
        partition-uuid = "AAAAAAAA-AAAA-AAAA-AAAA-AAAAAAAAAAAA"
        image = "rootfs.squashfs"
        size = 1024M
    }
    partition rootfs-b {
        partition-uuid = "BBBBBBBB-BBBB-BBBB-BBBB-BBBBBBBBBBBB"
        image = "rootfs.squashfs"
        size = 1024M
    }
    partition data {
        partition-uuid = "DDDDDDDD-DDDD-DDDD-DDDD-DDDDDDDDDDDD"
        partition-type-uuid = "L"
        image = "data.ext4"
        size = 256M
    }
    # MUST stay last on the GPT so waypoint-resize can grow it to fill the
    # card. Seeded at 64M (from store.ext4); grown online at first boot.
    partition store {
        partition-uuid = "EEEEEEEE-EEEE-EEEE-EEEE-EEEEEEEEEEEE"
        partition-type-uuid = "L"
        image = "store.ext4"
    }
}
