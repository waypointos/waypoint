# systemd-timesyncd configuration.
#
# Pi 5 has no battery-backed RTC. On every boot the clock starts at the
# image build timestamp (whatever was baked in by Buildroot) and only
# advances forward — so for the first ~tens of seconds after boot the
# system clock is months out of date. TLS handshakes against the proxy
# fail during that window with "x509: certificate has expired or is not
# yet valid", and the leaf-node retry loop fills journalctl with errors
# until timesyncd catches up.
#
# Explicit NTP servers (rather than the upstream Buildroot default) so
# DNS race conditions on first boot don't drag sync into minutes. Google's
# anycast time servers as primary, the public NTP pool as fallback.
[Time]
NTP=time1.google.com time2.google.com time3.google.com time4.google.com
FallbackNTP=0.pool.ntp.org 1.pool.ntp.org 2.pool.ntp.org 3.pool.ntp.org
